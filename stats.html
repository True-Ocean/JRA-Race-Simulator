<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>集計 · JRA RACE SIMULATOR</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1b2a;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      min-height: 100dvh;
      padding: 16px 14px 32px;
    }
    a { color: #7eb8d4; }
    h1 {
      color: #f0c040;
      font-size: clamp(1.05rem, 2vw + 0.6rem, 1.65rem);
      margin-bottom: 10px;
      text-shadow: 0 0 10px rgba(240,192,64,0.45);
    }
    .stats-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 16px;
      margin-bottom: 14px;
    }
    .stats-muted { color: #8899aa; font-size: 0.88rem; }
    #stats-error { color: #f08080; margin-bottom: 8px; min-height: 1.2em; }
    #stats-race-info { color: #c5d8e8; font-size: 0.92rem; margin-bottom: 12px; }
    .stats-lead {
      background: #132030;
      border: 1px solid #2a3f55;
      padding: 10px 14px;
      border-radius: 4px;
      margin-bottom: 14px;
      max-width: 720px;
    }
    .stats-table {
      width: 100%;
      max-width: 900px;
      border-collapse: collapse;
      font-size: 0.82rem;
    }
    .stats-table th,
    .stats-table td {
      border: 1px solid #2a3f55;
      padding: 6px 8px;
      text-align: left;
    }
    .stats-table th {
      background: #152535;
      color: #b8c8d8;
    }
    .stats-table tr:nth-child(even) td { background: rgba(0,0,0,0.12); }
    #stats-trial-summary { font-size: 0.85rem; color: #aabccc; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="stats-top">
    <a href="./index.html">← シミュレータに戻る</a>
  </div>
  <h1>📈 シミュレーション集計</h1>
  <p id="stats-error" aria-live="polite"></p>
  <div id="stats-race-info"></div>
  <p id="stats-trial-summary" class="stats-muted"></p>
  <p class="stats-lead stats-muted">
    シミュレータでレースを最後まで再生し、ゴール演出で決まった着順がレースサマリーと同じ基準でここに蓄積されます。一括の自動試行は行いません。
  </p>
  <div id="stats-table-wrap"></div>
  <script type="module" src="./src/stats/stats-app.js"></script>
</body>
</html>
