<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>集計 · Horse Race Simulator</title>
  <meta name="description" content="Horse Race Simulator の複数シミュレーション結果を集計・比較する画面。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Horse Race Simulator">
  <meta property="og:title" content="集計 · Horse Race Simulator">
  <meta property="og:description" content="Horse Race Simulator の複数シミュレーション結果を集計・比較する画面。">
  <meta property="og:url" content="https://true-ocean.github.io/JRA-Race-Simulator/stats.html">
  <meta property="og:image" content="https://true-ocean.github.io/JRA-Race-Simulator/og-image.png">
  <meta property="og:image:width" content="1693">
  <meta property="og:image:height" content="929">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="集計 · Horse Race Simulator">
  <meta name="twitter:description" content="Horse Race Simulator の複数シミュレーション結果を集計・比較する画面。">
  <meta name="twitter:image" content="https://true-ocean.github.io/JRA-Race-Simulator/og-image.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }
    body {
      background: #0d1b2a;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      min-height: 100dvh;
      overflow-x: hidden;
      overflow-y: auto;
      padding:
        max(16px, env(safe-area-inset-top, 0px))
        max(14px, env(safe-area-inset-right, 0px))
        max(32px, env(safe-area-inset-bottom, 0px))
        max(14px, env(safe-area-inset-left, 0px));
    }
    a { color: #7eb8d4; }
    .stats-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px 16px;
      margin-bottom: 16px;
      width: min(100%, 1040px);
      margin-left: auto;
      margin-right: auto;
    }
    button {
      touch-action: manipulation;
    }
    #btn-stats-back {
      padding: 6px 14px;
      font-size: 0.78rem;
      font-family: inherit;
      cursor: pointer;
      background: #1e3a52;
      border: 1px solid #445566;
      color: #e7f3fb;
      width: 9.4rem;
    }
    #btn-stats-back:hover { filter: brightness(1.08); }
    #btn-stats-reset {
      padding: 6px 14px;
      font-size: 0.78rem;
      font-family: inherit;
      cursor: pointer;
      background: #3a2020;
      border: 1px solid #664444;
      color: #f0d0d0;
      width: 9.4rem;
    }
    #btn-stats-reset:hover { filter: brightness(1.08); }
    .stats-page-center {
      max-width: 1040px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
    .app-main-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.45em;
      flex-wrap: nowrap;
      white-space: nowrap;
      min-width: 0;
      color: #f0c040;
      font-size: clamp(1.1rem, 2.35vw + 0.65rem, 2.85rem);
      font-weight: 700;
      letter-spacing: clamp(0.06em, 0.45vw, 0.2em);
      margin-bottom: 12px;
      text-shadow: 0 0 12px rgba(240,192,64,0.5);
      text-align: center;
      width: 100%;
    }
    .app-main-title .title-brand-icon {
      display: inline-flex;
      flex-shrink: 0;
      align-items: center;
      justify-content: center;
      line-height: 1;
      font-size: 1.08em;
    }
    .app-main-title .title-text {
      min-width: 0;
    }
    .app-subtitle {
      text-align: center;
      font-size: clamp(0.9rem, 1vw + 0.64rem, 1.14rem);
      font-weight: 700;
      letter-spacing: 0.11em;
      margin: -2px 0 12px;
      width: 100%;
    }
    .app-subtitle--stats {
      color: #fda4af;
    }
    #stats-trial-summary {
      font-size: 0.85rem;
      color: #aabccc;
      margin-bottom: 12px;
      text-align: center;
      width: 100%;
    }
    .stats-muted { color: #8899aa; font-size: 0.88rem; }
    #stats-error {
      color: #f08080;
      margin: 0 auto 10px;
      min-height: 1.2em;
      text-align: center;
      max-width: 1040px;
    }
    #stats-race-info {
      font-size: 0.84rem;
      color: #8cb8d1;
      background: #06111e;
      border: 1px solid #1e3a5f;
      border-radius: 8px;
      padding: 9px 14px;
      letter-spacing: 0.02em;
      line-height: 1.45;
      margin-bottom: 14px;
      width: 100%;
      max-width: 1040px;
      text-align: center;
    }
    #stats-race-info b { color: #e7f3fb; font-weight: bold; }
    #stats-table-wrap {
      width: 100%;
      max-width: 1040px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #stats-table-wrap > .stats-muted { text-align: center; margin-top: 8px; }
    #stats-sort-hint {
      width: 100%;
      max-width: 1040px;
      margin: 0 auto 6px;
      text-align: right;
      color: #8da6ba;
      font-size: 0.75rem;
      line-height: 1.45;
    }
    #stats-mark-note {
      width: 100%;
      max-width: 1040px;
      margin: 8px auto 0;
      text-align: left;
      color: #8da6ba;
      font-size: 0.75rem;
      line-height: 1.55;
    }
    .stats-table {
      width: 100%;
      max-width: 1040px;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 1rem;
      margin: 0 auto;
    }
    .stats-table col.stats-col-horse-main { width: 23%; }
    .stats-table col.stats-col-horse-sex { width: 5%; }
    .stats-table col.stats-col-horse-jockey { width: 9%; }
    .stats-table col.stats-col-mark { width: 4.5%; }
    .stats-table col.stats-col-user-mark { width: 4.5%; }
    .stats-table col.stats-col-metric { width: 7.8%; }
    .stats-table th,
    .stats-table td {
      border: 1px solid #2a3f55;
      padding: 6px 5px;
      text-align: left;
    }
    .stats-table th {
      background: #152535;
      color: #b8c8d8;
      vertical-align: middle;
    }
    .stats-table th.stats-col-metric {
      text-align: center;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      font-size: 0.72rem;
      line-height: 1.2;
      padding: 5px 3px;
      letter-spacing: -0.02em;
    }
    .stats-table th.stats-col-mark,
    .stats-table td.stats-col-mark,
    .stats-table th.stats-col-user-mark,
    .stats-table td.stats-col-user-mark {
      text-align: center;
      font-weight: 700;
      white-space: nowrap;
      padding-left: 2px;
      padding-right: 2px;
    }
    .stats-table th.stats-col-mark,
    .stats-table th.stats-col-user-mark {
      font-size: 0.72rem;
      line-height: 1.2;
      padding: 5px 3px;
      letter-spacing: -0.02em;
      cursor: pointer;
      user-select: none;
    }
    .stats-table td.stats-col-mark {
      color: #ffd166;
      text-shadow: 0 0 6px rgba(255, 209, 102, 0.35);
      font-size: 0.95rem;
      letter-spacing: 0.04em;
    }
    .stats-table td.stats-col-user-mark {
      color: #a7f3d0;
      text-shadow: 0 0 6px rgba(167, 243, 208, 0.28);
      font-size: 0.95rem;
      letter-spacing: 0.04em;
    }
    .stats-table th.stats-sortable:hover {
      color: #e7f3fb;
      background: #1a3048;
    }
    .stats-table td.stats-col-metric {
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-size: 0.88rem;
    }
    .stats-table th.stats-horse-th-merged {
      text-align: center;
    }
    .stats-table th.stats-horse-sort-th {
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      font-size: 0.72rem;
      line-height: 1.2;
      padding: 5px 4px;
      letter-spacing: -0.02em;
    }
    .stats-table th.stats-horse-sort-th:hover {
      color: #e7f3fb;
      background: #1a3048;
    }
    .stats-horse-block {
      vertical-align: middle;
      background-clip: padding-box;
    }
    /* 3分割したが外枠は1つのセルブロックのように見せる */
    .stats-table td.stats-horse-block-start {
      text-align: left;
      border-right: none;
      padding-left: 10px;
      padding-right: 4px;
    }
    .stats-table td.stats-horse-block-mid {
      text-align: center;
      border-left: none;
      border-right: none;
      padding-left: 4px;
      padding-right: 4px;
      white-space: nowrap;
    }
    .stats-table td.stats-horse-block-end {
      text-align: left;
      border-left: none;
      padding-left: 4px;
      padding-right: 2px;
    }
    .stats-horse-main-inner {
      display: inline-flex;
      flex-direction: row;
      align-items: center;
      gap: 10px;
      max-width: 100%;
    }
    .stats-horse-name-inline {
      font-weight: bold;
      color: #f0f4f8;
      flex: 0 1 auto;
      min-width: 0;
      max-width: 100%;
      white-space: normal;
      word-break: keep-all;
      overflow-wrap: anywhere;
      line-height: 1.35;
    }
    .stats-sex {
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .stats-sex.is-male {
      color: #93c5fd;
      text-shadow: 0 0 5px rgba(147, 197, 253, 0.28);
    }
    .stats-sex.is-female {
      color: #f9a8d4;
      text-shadow: 0 0 5px rgba(249, 168, 212, 0.28);
    }
    .stats-sex:not(.is-male):not(.is-female) {
      color: #c8d4e0;
    }
    .stats-jockey {
      font-size: 0.82rem;
      color: #aabccc;
      white-space: normal;
      word-break: keep-all;
      overflow-wrap: anywhere;
      line-height: 1.35;
    }
    .stats-table tr:nth-child(even) td { background: rgba(0,0,0,0.12); }
    .entry-gate {
      display: inline-block;
      width: 26px;
      height: 26px;
      border-radius: 4px;
      text-align: center;
      line-height: 26px;
      font-weight: bold;
      font-size: 0.8rem;
      flex-shrink: 0;
    }

    @media (min-width: 1025px) {
      #stats-race-info br.race-info-break {
        display: none;
      }
    }

    @media (max-width: 1024px) {
      .stats-toolbar {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px 8px;
        flex-direction: unset;
        flex-wrap: unset;
        align-items: stretch;
        justify-content: stretch;
        width: 100%;
        max-width: none;
        margin-bottom: 12px;
      }
      #btn-stats-back,
      #btn-stats-reset {
        width: 100%;
        max-width: none;
        min-height: 34px;
        padding: 5px 10px;
        font-size: 0.72rem;
        box-sizing: border-box;
      }
      .stats-page-center {
        max-width: none;
        align-items: stretch;
      }
      #stats-table-wrap {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        align-items: stretch;
        max-width: 100%;
      }
      .stats-table {
        table-layout: fixed;
        width: 100%;
        min-width: 0;
        font-size: 0.7rem;
      }
      .stats-table col.stats-col-mark { width: 1.7rem; }
      .stats-table col.stats-col-horse-main { width: 26%; }
      .stats-table col.stats-col-horse-sex { width: 1.85rem; }
      .stats-table col.stats-col-horse-jockey { width: 12%; }
      .stats-table col.stats-col-metric { width: 6.2%; }
      .stats-table col.stats-col-user-mark { width: 1.7rem; }
      .stats-table th,
      .stats-table td {
        padding: 4px 2px;
      }
      .stats-table th.stats-col-metric,
      .stats-table th.stats-horse-sort-th {
        font-size: 0.54rem;
        line-height: 1.15;
        padding: 4px 1px;
        letter-spacing: -0.03em;
        white-space: normal;
        word-break: keep-all;
      }
      .stats-table th.stats-col-mark,
      .stats-table th.stats-col-user-mark {
        font-size: 0.54rem;
        line-height: 1.15;
        padding: 4px 1px;
        letter-spacing: -0.02em;
      }
      .stats-table td.stats-col-metric {
        font-size: 0.64rem;
        padding-left: 1px;
        padding-right: 1px;
      }
      .stats-table td.stats-col-mark,
      .stats-table td.stats-col-user-mark {
        font-size: 0.72rem;
      }
      .stats-table td.stats-horse-block-start {
        padding-left: 4px;
        padding-right: 2px;
      }
      .stats-table td.stats-horse-block-mid,
      .stats-table td.stats-horse-block-end {
        padding-left: 2px;
        padding-right: 2px;
      }
      .stats-horse-main-inner {
        gap: 4px;
      }
      .stats-horse-name-inline {
        font-size: 0.64rem;
        line-height: 1.3;
      }
      .stats-sex,
      .stats-jockey {
        font-size: 0.6rem;
        line-height: 1.3;
      }
      .entry-gate {
        width: 20px;
        height: 20px;
        line-height: 20px;
        font-size: 0.64rem;
      }
      #stats-race-info {
        white-space: normal;
        font-size: 0.8rem;
        padding: 8px 10px;
      }
      #stats-race-info .race-info-sep {
        display: none;
      }
      #stats-sort-hint,
      #stats-mark-note {
        font-size: 0.68rem;
      }
    }

    @media (max-width: 600px) {
      .app-main-title {
        flex-wrap: wrap;
        white-space: normal;
        line-height: 1.2;
        font-size: clamp(0.95rem, 4.2vw + 0.55rem, 2.1rem);
      }
      #stats-race-info {
        font-size: 0.78rem;
        padding: 8px 10px;
      }
      .stats-table {
        font-size: 0.64rem;
      }
      .stats-table col.stats-col-mark { width: 1.55rem; }
      .stats-table col.stats-col-horse-main { width: 24%; }
      .stats-table col.stats-col-horse-sex { width: 1.7rem; }
      .stats-table col.stats-col-horse-jockey { width: 11%; }
      .stats-table col.stats-col-metric { width: 6%; }
      .stats-table col.stats-col-user-mark { width: 1.55rem; }
      .stats-table th.stats-col-metric,
      .stats-table th.stats-horse-sort-th,
      .stats-table th.stats-col-mark,
      .stats-table th.stats-col-user-mark {
        font-size: 0.5rem;
        padding: 3px 1px;
        letter-spacing: -0.04em;
      }
      .stats-table td.stats-col-metric {
        font-size: 0.58rem;
      }
      .stats-table td.stats-col-mark,
      .stats-table td.stats-col-user-mark {
        font-size: 0.66rem;
      }
      .stats-horse-name-inline {
        font-size: 0.6rem;
      }
      .stats-sex,
      .stats-jockey {
        font-size: 0.56rem;
      }
      .entry-gate {
        width: 18px;
        height: 18px;
        line-height: 18px;
        font-size: 0.58rem;
      }
      #stats-race-info {
        font-size: 0.72rem;
        padding: 7px 8px;
      }
      #stats-sort-hint {
        text-align: left;
        font-size: 0.64rem;
      }
      #stats-mark-note {
        font-size: 0.64rem;
      }
    }
  </style>
</head>
<body>
  <div class="stats-toolbar">
    <button type="button" id="btn-stats-back">前画面に戻る</button>
    <button type="button" id="btn-stats-reset">集計リセット</button>
  </div>
  <p id="stats-error" aria-live="polite"></p>
  <div class="stats-page-center">
    <h1 class="app-main-title">
      <span class="title-brand-icon" aria-hidden="true">🏇</span>
      <span class="title-text">Horse Race Simulator</span>
    </h1>
    <p class="app-subtitle app-subtitle--stats">シミュレーション集計</p>
    <p id="stats-trial-summary" class="stats-muted"></p>
    <div id="stats-race-info"></div>
    <p id="stats-sort-hint" class="stats-muted">見出しクリックで並べ替え</p>
    <div id="stats-table-wrap"></div>
    <p id="stats-mark-note" class="stats-muted">
      <strong>【推奨印の説明】</strong><br>
      ◎: 1着経験馬で総合1位<br>
      ◯▲: 2着以内経験馬で総合上位<br>
      △: 3着以内経験馬で平均着順上位<br>
      ★: 3着以内経験馬で複勝率上位<br>
      ☆: 未選出馬から1着→2着以内→3着以内の順でロマン指数最大
    </p>
  </div>
  <script type="module" src="./src/stats/stats-app.js"></script>
</body>
</html>
