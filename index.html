<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JRA RACE SIMULATOR</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1b2a;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      height: 100dvh;
      padding: 14px 12px;
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 0;
      overflow: hidden;
    }

    h1 {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.45em;
      flex-wrap: nowrap;
      white-space: nowrap;
      min-width: 0;
      text-align: center;
      color: #f0c040;
      /* 1行に収まるよう上限を抑え、ビューポートに追従して縮小 */
      font-size: clamp(1.1rem, 2.35vw + 0.65rem, 2.85rem);
      font-weight: 700;
      letter-spacing: clamp(0.06em, 0.45vw, 0.2em);
      margin-bottom: 12px;
      text-shadow: 0 0 12px rgba(240,192,64,0.5);
    }

    h1 .title-brand-icon {
      display: inline-flex;
      flex-shrink: 0;
      align-items: center;
      justify-content: center;
      line-height: 1;
      font-size: 1.08em;
    }

    h1 .title-text {
      min-width: 0;
    }

    /* ===== コントロール ===== */
    #controls {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }

    #sim-options {
      gap: 6px;
      color: #9ec3d8;
      letter-spacing: 0.03em;
      border: 1px solid #2c5275;
      border-radius: 6px;
      background: rgba(16, 40, 63, 0.65);
      cursor: pointer;
    }
    #sim-options input { accent-color: #f0c040; }

    button {
      background: #1e3a5f;
      color: #f0c040;
      border: 1px solid #f0c040;
      border-radius: 6px;
      padding: 8px 22px;
      font-family: inherit;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover  { background: #2a4f80; }
    button:active { background: #f0c040; color: #0d1b2a; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    /* タイトル直下の3つ（開始・リセット・再現性）を同一サイズのボックスに */
    #controls > button,
    #controls > #sim-options {
      flex: 0 0 12rem;
      width: 12rem;
      min-height: 2.75rem;
      padding: 8px 10px;
      font-size: 0.85rem;
      box-sizing: border-box;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* ===== 3カラムメインレイアウト：左右を広く、中央を縦長に ===== */
    #main-layout {
      display: grid;
      grid-template-columns: 300px 1fr 320px;
      grid-template-rows: auto 1fr;
      gap: 10px;
      align-items: stretch;
      min-height: 0;
    }

    .section-title {
      font-size: 0.68rem;
      letter-spacing: 0.15em;
      color: #7eb8d4;
      text-transform: uppercase;
      margin-bottom: 6px;
      border-bottom: 1px solid #1e3a5f;
      padding-bottom: 4px;
    }

    #race-info {
      grid-column: 1 / -1;
      background: #06111e;
      border: 1px solid #1e3a5f;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.72rem;
      color: #8cb8d1;
      margin-bottom: 2px;
    }
    #race-info b { color: #e7f3fb; font-weight: bold; }

    /* ===== 左カラム：出馬表（充実版） ===== */
    #entry-panel {
      background: #06111e;
      border: 1px solid #1e3a5f;
      border-radius: 8px;
      padding: 7px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    #entry-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex: 1;
      overflow-y: auto;
      padding-right: 2px;
      min-height: 0;
    }

    .entry-row {
      display: grid;
      grid-template-columns: 24px 1fr;
      gap: 5px;
      align-items: start;
      background: #0f1e30;
      border-radius: 5px;
      padding: 4px 5px;
      font-size: 0.66rem;
    }

    .entry-gate {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      text-align: center;
      line-height: 24px;
      font-weight: bold;
      font-size: 0.74rem;
      flex-shrink: 0;
    }

    .entry-info { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
    .entry-meta-line {
      display: flex;
      align-items: baseline;
      gap: 6px;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
    }
    .entry-name {
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 700;
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .entry-demographics {
      color: #fde68a;
      font-size: 0.56rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      flex: 0 0 auto;
    }
    .entry-demographics.is-male {
      color: #93c5fd;
      text-shadow: 0 0 5px rgba(147, 197, 253, 0.28);
    }
    .entry-demographics.is-female {
      color: #f9a8d4;
      text-shadow: 0 0 5px rgba(249, 168, 212, 0.28);
    }
    .entry-jockey-inline {
      color: #93c5fd;
      font-size: 0.56rem;
      flex: 0 0 auto;
    }
    .entry-style-inline {
      color: #86efac;
      font-size: 0.54rem;
      font-weight: 700;
      border: 1px solid rgba(134, 239, 172, 0.45);
      border-radius: 999px;
      padding: 0 6px;
      line-height: 1.35;
      flex: 0 0 auto;
    }

    /* パラメータバー */
    .entry-params { margin-top: 1px; display: flex; flex-direction: column; gap: 1px; }
    .param-row {
      display: grid;
      grid-template-columns: 22px 1fr 20px;
      align-items: center;
      gap: 2px;
    }
    .param-label { font-size: 0.58rem; color: #556677; text-align: right; }
    .param-bar-bg {
      height: 4px;
      background: rgba(255,255,255,0.08);
      border-radius: 3px;
      overflow: hidden;
    }
    .param-bar {
      height: 100%;
      border-radius: 3px;
      transition: width 0.4s ease;
    }
    .stamina-remain-bar { background: linear-gradient(90deg, #22c55e, #4ade80); }
    .stamina-remain-bar.is-warning { background: linear-gradient(90deg, #f59e0b, #facc15); }
    .stamina-remain-bar.is-critical { background: linear-gradient(90deg, #ef4444, #f87171); }
    .param-val { font-size: 0.56rem; color: #7eb8d4; text-align: right; }

    /* ===== 中央カラム：盤面（縦長） ===== */
    #field-wrap {
      position: relative;
      background: #06111e;
      border: 1px solid #1e3a5f;
      border-radius: 10px;
      overflow: hidden;
      height: 100%;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
    }

    #field-viewport {
      position: relative;
      height: 100%;
      max-width: 100%;
      aspect-ratio: 9 / 16;
    }

    #field-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* フェーズ表示（DOM側テキスト）：Canvas内に描画するため非表示 */
    #phase-indicator {
      display: none;
    }

    /* ===== 右カラム：レースログ / 着順掲示板 ===== */
    #right-panel {
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .right-block {
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: #0a1828;
      border: 1px solid #15324d;
      border-radius: 6px;
      padding: 6px;
    }
    #race-log-block {
      flex: 1;
    }
    #placing-log-block {
      flex: 0 0 26rem;
    }

    #log-panel {
      flex: 1;
      overflow-y: auto;
      padding-right: 2px;
    }
    #placing-panel {
      flex: 1;
      overflow-y: auto;
      padding-right: 2px;
    }

    .log-entry {
      font-size: 0.75rem;
      padding: 3px 0;
      border-bottom: 1px solid #0a1825;
      color: #c8d4df;
      line-height: 1.55;
    }
    .log-entry.battle { font-weight: bold; }
    .log-entry.irregular { font-weight: bold; }
    .log-tag { font-weight: bold; margin-right: 6px; }
    .log-tag.battle-default { color: #f0a040; }
    .log-tag.battle-lead { color: #f59e0b; }
    .log-tag.battle-corner { color: #22d3ee; }
    .log-tag.battle-final { color: #f472b6; }
    .log-tag.battle-lane { color: #a78bfa; }
    .log-tag.battle-block { color: #fb7185; }
    .log-tag.irregular-start { color: #f97316; }
    .log-tag.irregular-stumble { color: #facc15; }
    .log-entry.scene-heading {
      font-weight: 700;
      color: #7dd3fc;
      text-shadow: 0 0 6px rgba(125, 211, 252, 0.35);
      margin-top: 5px;
      margin-bottom: 5px;
      padding: 7px 0 8px;
      border-top: 1px solid #2a4a62;
      border-bottom: 1px solid #2a4a62;
      background: rgba(15, 33, 48, 0.55);
      text-align: center;
    }
    .scene-heading-label {
      display: block;
      letter-spacing: 0.04em;
      text-align: center;
    }
    .log-entry.placing {
      font-weight: bold;
      color: #fde047;
      text-shadow: 0 0 6px rgba(253, 224, 71, 0.45);
    }
    .log-tag.placing { color: #fde047; text-shadow: 0 0 6px rgba(253, 224, 71, 0.45); }
    .placing-entry {
      font-size: 0.70rem;
      padding: 2px 0;
      border-bottom: 1px solid #142538;
      color: #eef4ff;
      font-weight: bold;
      text-shadow: none;
      line-height: 1.35;
      font-variant-numeric: tabular-nums;
    }
    .placing-entry.top5 {
      color: #fde047;
      text-shadow: 0 0 6px rgba(253, 224, 71, 0.42);
    }
    .placing-rank {
      display: inline-block;
      min-width: 2.8em;
      margin-right: 0.22em;
      color: inherit;
    }
    .placing-entry .horse-name {
      color: inherit;
      margin-left: 0.12em;
    }
    .race-summary-scene {
      color: #f97316;
      font-weight: 800;
      text-shadow: 0 0 6px rgba(249, 115, 22, 0.35);
    }
    .horse-badge {
      display: inline-block;
      width: 1.95em;
      padding: 0;
      margin-right: 0.28em;
      border-radius: 3px;
      border: 1px solid rgba(255,255,255,0.30);
      text-align: center;
      font-size: 0.72em;
      font-weight: bold;
      line-height: 1.3;
      vertical-align: baseline;
      font-variant-numeric: tabular-nums;
    }
    .horse-name { margin-right: 0.08em; }

  </style>
</head>
<body>
  <h1>
    <span class="title-brand-icon" aria-hidden="true">🏇</span>
    <span class="title-text">JRA RACE SIMULATOR</span>
  </h1>

  <!-- コントロール -->
  <div id="controls">
    <button id="btn-run">▶ レース開始</button>
    <button id="btn-reset" disabled>↺ リセット</button>
    <label id="sim-options">
      <input id="toggle-reproducible" type="checkbox">
      再現性モード
    </label>
  </div>

  <!-- 3カラムレイアウト -->
  <div id="main-layout">
    <div id="race-info"></div>

    <!-- 左：出馬表 -->
    <div id="entry-panel">
      <p class="section-title">📋 出馬表</p>
      <div id="entry-list"></div>
    </div>

    <!-- 中央：盤面 -->
    <div id="field-wrap">
      <div id="field-viewport">
        <canvas id="field-canvas"></canvas>
      </div>
      <div id="phase-indicator">スタート</div>
    </div>

    <!-- 右：レースログ -->
    <div id="right-panel">
      <div class="right-block" id="race-log-block">
        <p class="section-title">📝 レースログ</p>
        <div id="log-panel">
          <div class="log-entry" style="color:#334;">待機中...</div>
        </div>
      </div>
      <div class="right-block" id="placing-log-block">
        <p class="section-title">🏁 着順掲示板</p>
        <div id="placing-panel"></div>
      </div>
    </div>

  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
