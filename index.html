<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JRA CARD SIMULATOR</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1b2a;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      height: 100dvh;
      padding: 14px 12px;
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 0;
      overflow: hidden;
    }

    h1 {
      text-align: center;
      color: #f0c040;
      font-size: 1.2rem;
      letter-spacing: 0.25em;
      margin-bottom: 12px;
      text-shadow: 0 0 12px rgba(240,192,64,0.5);
    }

    /* ===== コントロール ===== */
    #controls {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }

    #sim-options {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #9ec3d8;
      font-size: 0.73rem;
      letter-spacing: 0.03em;
      border: 1px solid #2c5275;
      border-radius: 6px;
      padding: 7px 10px;
      background: rgba(16, 40, 63, 0.65);
    }
    #sim-options input { accent-color: #f0c040; }

    button {
      background: #1e3a5f;
      color: #f0c040;
      border: 1px solid #f0c040;
      border-radius: 6px;
      padding: 8px 22px;
      font-family: inherit;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover  { background: #2a4f80; }
    button:active { background: #f0c040; color: #0d1b2a; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ===== 3カラムメインレイアウト：左右を広く、中央を縦長に ===== */
    #main-layout {
      display: grid;
      grid-template-columns: 300px 1fr 320px;
      grid-template-rows: auto 1fr;
      gap: 10px;
      align-items: stretch;
      min-height: 0;
    }

    .section-title {
      font-size: 0.68rem;
      letter-spacing: 0.15em;
      color: #7eb8d4;
      text-transform: uppercase;
      margin-bottom: 6px;
      border-bottom: 1px solid #1e3a5f;
      padding-bottom: 4px;
    }

    #race-info {
      grid-column: 1 / -1;
      background: #06111e;
      border: 1px solid #1e3a5f;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.72rem;
      color: #8cb8d1;
      margin-bottom: 2px;
    }
    #race-info b { color: #e7f3fb; font-weight: bold; }

    /* ===== 左カラム：出馬表（充実版） ===== */
    #entry-panel {
      background: #06111e;
      border: 1px solid #1e3a5f;
      border-radius: 8px;
      padding: 7px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    #entry-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex: 1;
      overflow-y: auto;
      padding-right: 2px;
      min-height: 0;
    }

    .entry-row {
      display: grid;
      grid-template-columns: 24px 1fr;
      gap: 5px;
      align-items: start;
      background: #0f1e30;
      border-radius: 5px;
      padding: 4px 5px;
      font-size: 0.66rem;
    }

    .entry-gate {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      text-align: center;
      line-height: 24px;
      font-weight: bold;
      font-size: 0.74rem;
      flex-shrink: 0;
    }

    .entry-info { display: flex; flex-direction: column; gap: 1px; }
    .entry-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      column-gap: 5px;
    }
    .entry-name { color: #fff; font-size: 0.72rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .entry-jockey { color: #7eb8d4; font-size: 0.56rem; white-space: nowrap; }

    /* パラメータバー */
    .entry-params { margin-top: 1px; display: flex; flex-direction: column; gap: 1px; }
    .param-row {
      display: grid;
      grid-template-columns: 22px 1fr 20px;
      align-items: center;
      gap: 2px;
    }
    .param-label { font-size: 0.58rem; color: #556677; text-align: right; }
    .param-bar-bg {
      height: 4px;
      background: rgba(255,255,255,0.08);
      border-radius: 3px;
      overflow: hidden;
    }
    .param-bar {
      height: 100%;
      border-radius: 3px;
      transition: width 0.4s ease;
    }
    .stamina-remain-bar { background: linear-gradient(90deg, #22c55e, #4ade80); }
    .param-val { font-size: 0.56rem; color: #7eb8d4; text-align: right; }

    /* ===== 中央カラム：盤面（縦長） ===== */
    #field-wrap {
      position: relative;
      background: #06111e;
      border: 1px solid #1e3a5f;
      border-radius: 10px;
      overflow: hidden;
      height: 100%;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
    }

    #field-viewport {
      position: relative;
      height: 100%;
      max-width: 100%;
      aspect-ratio: 9 / 16;
    }

    #field-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* フェーズ表示（DOM側テキスト）：Canvas内に描画するため非表示 */
    #phase-indicator {
      display: none;
    }

    /* ===== 右カラム：レースログ ===== */
    #right-panel {
      background: #06111e;
      border: 1px solid #1e3a5f;
      border-radius: 8px;
      padding: 7px;
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .right-block {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: #0a1828;
      border: 1px solid #15324d;
      border-radius: 6px;
      padding: 6px;
    }

    #log-panel {
      flex: 1;
      overflow-y: auto;
      padding-right: 2px;
    }

    .log-entry {
      font-size: 0.75rem;
      padding: 3px 0;
      border-bottom: 1px solid #0a1825;
      color: #c8d4df;
      line-height: 1.55;
    }
    .log-entry.battle { font-weight: bold; }
    .log-entry.irregular { font-weight: bold; }
    .log-tag { font-weight: bold; margin-right: 6px; }
    .log-tag.battle-default { color: #f0a040; }
    .log-tag.battle-lead { color: #f59e0b; }
    .log-tag.battle-corner { color: #22d3ee; }
    .log-tag.battle-final { color: #f472b6; }
    .log-tag.battle-lane { color: #a78bfa; }
    .log-tag.battle-block { color: #fb7185; }
    .log-tag.irregular-start { color: #f97316; }
    .log-tag.irregular-stumble { color: #facc15; }
    .log-entry.placing {
      font-weight: bold;
      color: #fde047;
      text-shadow: 0 0 6px rgba(253, 224, 71, 0.45);
    }
    .log-tag.placing { color: #fde047; text-shadow: 0 0 6px rgba(253, 224, 71, 0.45); }
    .horse-badge {
      display: inline-block;
      width: 1.95em;
      padding: 0;
      margin-right: 0.28em;
      border-radius: 3px;
      border: 1px solid rgba(255,255,255,0.30);
      text-align: center;
      font-size: 0.72em;
      font-weight: bold;
      line-height: 1.3;
      vertical-align: baseline;
      font-variant-numeric: tabular-nums;
    }
    .horse-name { margin-right: 0.08em; }

  </style>
</head>
<body>
  <h1>🏇 JRA CARD SIMULATOR</h1>

  <!-- コントロール -->
  <div id="controls">
    <button id="btn-run">▶ レース開始</button>
    <button id="btn-reset" disabled>↺ リセット</button>
    <label id="sim-options">
      <input id="toggle-reproducible" type="checkbox" checked>
      再現性モード（同条件で同結果）
    </label>
  </div>

  <!-- 3カラムレイアウト -->
  <div id="main-layout">
    <div id="race-info"></div>

    <!-- 左：出馬表 -->
    <div id="entry-panel">
      <p class="section-title">📋 出馬表</p>
      <div id="entry-list"></div>
    </div>

    <!-- 中央：盤面 -->
    <div id="field-wrap">
      <div id="field-viewport">
        <canvas id="field-canvas"></canvas>
      </div>
      <div id="phase-indicator">スタート</div>
    </div>

    <!-- 右：レースログ -->
    <div id="right-panel">
      <div class="right-block">
        <p class="section-title">📝 レースログ</p>
        <div id="log-panel">
          <div class="log-entry" style="color:#334;">待機中...</div>
        </div>
      </div>
    </div>

  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
