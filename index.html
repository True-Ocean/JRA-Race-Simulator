<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JRA RACE SIMULATOR</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1b2a;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      height: 100dvh;
      padding: 14px 12px;
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 0;
      overflow: hidden;
    }

    h1,
    .app-main-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.45em;
      flex-wrap: nowrap;
      white-space: nowrap;
      min-width: 0;
      text-align: center;
      color: #f0c040;
      /* 1行に収まるよう上限を抑え、ビューポートに追従して縮小 */
      font-size: clamp(1.1rem, 2.35vw + 0.65rem, 2.85rem);
      font-weight: 700;
      letter-spacing: clamp(0.06em, 0.45vw, 0.2em);
      margin-bottom: 12px;
      text-shadow: 0 0 12px rgba(240,192,64,0.5);
    }

    h1 .title-brand-icon,
    .app-main-title .title-brand-icon {
      display: inline-flex;
      flex-shrink: 0;
      align-items: center;
      justify-content: center;
      line-height: 1;
      font-size: 1.08em;
    }

    h1 .title-text,
    .app-main-title .title-text {
      min-width: 0;
    }
    .app-subtitle {
      text-align: center;
      font-size: clamp(0.9rem, 1vw + 0.64rem, 1.14rem);
      font-weight: 700;
      letter-spacing: 0.11em;
      margin: -2px 0 12px;
    }
    .app-subtitle--simulator { color: #7dd3fc; }
    .app-subtitle--pre-race { color: #86efac; }
    .app-subtitle--summary { color: #c4b5fd; }

    /* ===== コントロール ===== */
    #controls {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }

    #sim-options {
      flex-direction: column;
      align-items: stretch;
      justify-content: center;
      gap: 6px;
      width: 100%;
      color: #9ec3d8;
      letter-spacing: 0.03em;
      border: 1px solid #2c5275;
      border-radius: 6px;
      background: rgba(16, 40, 63, 0.65);
      cursor: default;
    }
    #sim-options label {
      display: grid;
      grid-template-columns: 1em minmax(0, 1fr);
      align-items: center;
      column-gap: 6px;
      width: 100%;
      cursor: pointer;
    }
    #sim-options input[type="checkbox"] {
      accent-color: #f0c040;
      margin: 0;
      width: 1em;
      height: 1em;
      justify-self: start;
    }

    button {
      background: #1e3a5f;
      color: #f0c040;
      border: 1px solid #f0c040;
      border-radius: 6px;
      padding: 8px 22px;
      font-family: inherit;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover  { background: #2a4f80; }
    button:active { background: #f0c040; color: #0d1b2a; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    /* シミュレーター画面からプレレースへ戻る（左上固定） */
    #btn-back-to-pre-race {
      position: fixed;
      top: 10px;
      left: max(12px, calc((100vw - 1660px) / 2));
      z-index: 150;
      padding: 5px 12px;
      font-size: 0.74rem;
      letter-spacing: 0.04em;
      border-radius: 6px;
      background: rgba(20, 38, 57, 0.9);
      border: 1px solid #3b5166;
      color: #d2deea;
      opacity: 0.88;
    }
    #btn-back-to-pre-race[hidden] {
      display: none !important;
    }

    /* タイトル直下：ボタンとオプション群を同一サイズのボックスに */
    #controls > button,
    #controls > #sim-options {
      flex: 0 0 12rem;
      width: 12rem;
      min-height: 3.35rem;
      padding: 8px 10px;
      font-size: 0.85rem;
      box-sizing: border-box;
      display: inline-flex;
      justify-content: center;
    }
    #controls > button {
      align-items: center;
    }
    #controls > #sim-options {
      align-items: flex-start;
    }

    /* ===== 3カラムメインレイアウト：左右を広く、中央を縦長に ===== */
    #main-layout {
      display: grid;
      grid-template-columns: 320px 1fr 320px;
      grid-template-rows: auto 1fr;
      gap: 10px;
      align-items: stretch;
      min-height: 0;
      width: min(100%, 1660px);
      margin: 0 auto;
    }

    .section-title {
      font-size: 0.68rem;
      letter-spacing: 0.15em;
      color: #7eb8d4;
      text-transform: uppercase;
      margin-bottom: 6px;
      border-bottom: 1px solid #1e3a5f;
      padding-bottom: 4px;
    }

    #race-info {
      grid-column: 1 / -1;
      background: #06111e;
      border: 1px solid #1e3a5f;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 0.84rem;
      color: #8cb8d1;
      margin: 0 auto 2px;
      width: min(100%, 1040px);
      text-align: center;
      line-height: 1.45;
      letter-spacing: 0.02em;
    }
    #race-info b { color: #e7f3fb; font-weight: bold; }

    /* ===== 左カラム：出馬表（充実版） ===== */
    #entry-panel {
      background: #06111e;
      border: 1px solid #1e3a5f;
      border-radius: 8px;
      padding: 7px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    #entry-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex: 1;
      overflow-y: auto;
      padding-right: 2px;
      min-height: 0;
    }

    .entry-row {
      display: grid;
      grid-template-columns: 24px 1fr;
      gap: 5px;
      align-items: start;
      background: #0f1e30;
      border-radius: 5px;
      padding: 4px 5px;
      font-size: 0.66rem;
    }

    .entry-gate {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      text-align: center;
      line-height: 24px;
      font-weight: bold;
      font-size: 0.74rem;
      flex-shrink: 0;
    }

    .entry-info { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
    .entry-meta-line {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
    }
    .entry-name {
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 700;
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .entry-demographics {
      color: #fde68a;
      font-size: 0.56rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      flex: 0 0 auto;
    }
    .entry-demographics.is-male {
      color: #93c5fd;
      text-shadow: 0 0 5px rgba(147, 197, 253, 0.28);
    }
    .entry-demographics.is-female {
      color: #f9a8d4;
      text-shadow: 0 0 5px rgba(249, 168, 212, 0.28);
    }
    .entry-jockey-inline {
      color: #93c5fd;
      font-size: 0.56rem;
      flex: 0 0 auto;
    }
    .entry-style-inline {
      font-size: 0.54rem;
      font-weight: 700;
      border-radius: 999px;
      padding: 3px 8px;
      line-height: 1.25;
      flex: 0 0 auto;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 1.55em;
      box-sizing: border-box;
    }
    /* 脚質別（先行隊列→後方加速のイメージで暖色→寒色） */
    .entry-style-inline.entry-style--oonige {
      color: #fdba74;
      border-color: rgba(251, 146, 60, 0.7);
      background: rgba(234, 88, 12, 0.22);
      box-shadow: 0 0 8px rgba(249, 115, 22, 0.2);
    }
    .entry-style-inline.entry-style--nige {
      color: #fde047;
      border-color: rgba(234, 179, 8, 0.65);
      background: rgba(161, 98, 7, 0.2);
      box-shadow: 0 0 6px rgba(234, 179, 8, 0.18);
    }
    .entry-style-inline.entry-style--senko {
      color: #7dd3fc;
      border-color: rgba(56, 189, 248, 0.6);
      background: rgba(3, 105, 161, 0.22);
      box-shadow: 0 0 6px rgba(14, 165, 233, 0.18);
    }
    .entry-style-inline.entry-style--sashi {
      color: #86efac;
      border-color: rgba(74, 222, 128, 0.55);
      background: rgba(22, 101, 52, 0.22);
      box-shadow: 0 0 6px rgba(34, 197, 94, 0.15);
    }
    .entry-style-inline.entry-style--oikomi {
      color: #d8b4fe;
      border-color: rgba(192, 132, 252, 0.65);
      background: rgba(107, 33, 168, 0.22);
      box-shadow: 0 0 8px rgba(168, 85, 247, 0.22);
    }
    .entry-style-inline.entry-style--default {
      color: #a7f3d0;
      border-color: rgba(134, 239, 172, 0.45);
      background: rgba(16, 185, 129, 0.12);
    }

    /* パラメータバー */
    .entry-params { margin-top: 1px; display: flex; flex-direction: column; gap: 1px; }
    .param-row {
      display: grid;
      grid-template-columns: 22px 1fr 20px;
      align-items: center;
      gap: 2px;
    }
    .param-label { font-size: 0.58rem; color: #556677; text-align: right; }
    .param-bar-bg {
      height: 4px;
      background: rgba(255,255,255,0.08);
      border-radius: 3px;
      overflow: hidden;
    }
    .param-bar {
      height: 100%;
      border-radius: 3px;
      transition: width 0.4s ease;
    }
    .stamina-remain-bar { background: linear-gradient(90deg, #22c55e, #4ade80); }
    .stamina-remain-bar.is-warning { background: linear-gradient(90deg, #f59e0b, #facc15); }
    .stamina-remain-bar.is-critical { background: linear-gradient(90deg, #ef4444, #f87171); }
    .param-val { font-size: 0.56rem; color: #7eb8d4; text-align: right; }

    /* ===== 中央カラム：盤面（縦長） ===== */
    #field-wrap {
      position: relative;
      background: #06111e;
      border: 1px solid #1e3a5f;
      border-radius: 10px;
      overflow: hidden;
      height: 100%;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
    }

    #field-viewport {
      position: relative;
      height: 100%;
      max-width: 100%;
      aspect-ratio: 9 / 16;
    }

    #field-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* フェーズ表示（DOM側テキスト）：Canvas内に描画するため非表示 */
    #phase-indicator {
      display: none;
    }

    /* ===== 右カラム：レースログ / 着順掲示板 ===== */
    #right-panel {
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .right-block {
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: #0a1828;
      border: 1px solid #15324d;
      border-radius: 6px;
      padding: 6px;
    }
    #race-log-block {
      flex: 1 1 0;
      min-height: 0;
    }
    /* 着順は行数ぶんの高さに収め、余白をレースログへ回す */
    #placing-log-block {
      flex: 0 0 auto;
      min-height: 0;
    }

    #log-panel {
      flex: 1;
      overflow-y: auto;
      padding-right: 2px;
    }
    #placing-panel {
      flex: 0 0 auto;
      overflow-y: auto;
      padding-right: 4px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      /* 極端に背が高い場合のみスクロール（通常18頭は自然高さで収まる想定） */
      max-height: min(52vh, calc(100dvh - 16rem));
    }
    /* ホーム右・着順掲示板：3列（着順・馬番・馬名）コンパクト表示 */
    #placing-panel .summary-placing-entry {
      grid-template-columns: 2.35em 1.85em minmax(0, 1fr);
      gap: 4px;
      padding: 3px 6px;
      align-items: center;
    }
    #placing-panel .summary-placing-rank {
      font-size: 0.68rem;
      line-height: 1.2;
    }
    #placing-panel .summary-placing-name {
      font-size: 0.66rem;
      line-height: 1.2;
    }
    #placing-panel .summary-placing-badge {
      width: 1.85em;
      padding: 1px 0;
      font-size: 0.68em;
      line-height: 1.15;
    }

    .log-entry {
      font-size: 0.75rem;
      padding: 3px 0;
      border-bottom: 1px solid #0a1825;
      color: #c8d4df;
      line-height: 1.55;
    }
    .log-entry.battle { font-weight: bold; }
    .log-entry.irregular { font-weight: bold; }
    .log-tag { font-weight: bold; margin-right: 6px; }
    .log-tag.battle-default { color: #f0a040; }
    .log-tag.battle-lead { color: #f59e0b; }
    .log-tag.battle-corner { color: #22d3ee; }
    .log-tag.battle-final { color: #f472b6; }
    .log-tag.battle-lane { color: #a78bfa; }
    .log-tag.battle-block { color: #fb7185; }
    .log-tag.irregular-start { color: #f97316; }
    .log-tag.irregular-stumble { color: #facc15; }
    .log-entry.scene-heading {
      font-weight: 700;
      color: #7dd3fc;
      text-shadow: 0 0 6px rgba(125, 211, 252, 0.35);
      margin-top: 5px;
      margin-bottom: 5px;
      padding: 7px 0 8px;
      border-top: 1px solid #2a4a62;
      border-bottom: 1px solid #2a4a62;
      background: rgba(15, 33, 48, 0.55);
      text-align: center;
    }
    .scene-heading-label {
      display: block;
      letter-spacing: 0.04em;
      text-align: center;
    }
    .log-entry.placing {
      font-weight: bold;
      color: #fde047;
      text-shadow: 0 0 6px rgba(253, 224, 71, 0.45);
    }
    .log-tag.placing { color: #fde047; text-shadow: 0 0 6px rgba(253, 224, 71, 0.45); }
    .placing-entry {
      font-size: 0.70rem;
      padding: 2px 0;
      border-bottom: 1px solid #142538;
      color: #eef4ff;
      font-weight: bold;
      text-shadow: none;
      line-height: 1.35;
      font-variant-numeric: tabular-nums;
    }
    .placing-entry.top5 {
      color: #fde047;
      text-shadow: 0 0 6px rgba(253, 224, 71, 0.42);
    }
    .placing-rank {
      display: inline-block;
      min-width: 2.8em;
      margin-right: 0.22em;
      color: inherit;
    }
    .placing-entry .horse-name {
      color: inherit;
      margin-left: 0.12em;
    }
    .race-summary-scene {
      color: #f97316;
      font-weight: 800;
      text-shadow: 0 0 6px rgba(249, 115, 22, 0.35);
    }
    .horse-badge {
      display: inline-block;
      width: 1.95em;
      padding: 0;
      margin-right: 0.28em;
      border-radius: 3px;
      border: 1px solid rgba(255,255,255,0.30);
      text-align: center;
      font-size: 0.72em;
      font-weight: bold;
      line-height: 1.3;
      vertical-align: baseline;
      font-variant-numeric: tabular-nums;
    }
    .horse-name { margin-right: 0.08em; }

    /* ===== プレレース・エントリーエディタ（全画面オーバーレイ） ===== */
    #pre-race-editor {
      position: fixed;
      inset: 0;
      z-index: 300;
      background: #0d1b2a;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 18px 16px 22px;
      gap: 10px;
      min-height: 0;
      height: 100dvh;
      max-height: 100dvh;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
      overflow: hidden;
    }
    #pre-race-editor[hidden] {
      display: none !important;
    }
    .pre-race-header {
      flex: 0 0 auto;
      text-align: center;
      width: min(100%, 1320px);
      margin: 0 auto;
    }
    .pre-race-toolbar {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      margin-bottom: 16px;
      width: 100%;
    }
    #pre-race-race-info {
      font-size: 0.84rem;
      color: #8cb8d1;
      background: #06111e;
      border: 1px solid #1e3a5f;
      border-radius: 8px;
      padding: 9px 14px;
      text-align: center;
      width: min(100%, 1040px);
      margin: 0 auto 4px;
      line-height: 1.45;
      letter-spacing: 0.02em;
    }
    #pre-race-race-info b { color: #e7f3fb; font-weight: bold; }
    .pre-race-table-wrap {
      flex: 1;
      min-height: 0;
      overflow: auto;
      border: 1px solid #1e3a5f;
      border-radius: 8px;
      background: #06111e;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      width: min(100%, 1320px);
      margin: 0 auto;
    }
    .pre-race-table-inner {
      flex: 0 0 auto;
      width: calc(100% - 32px);
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      transform-origin: top center;
    }
    .pre-race-table {
      width: 100%;
      min-width: 980px;
      table-layout: fixed;
      border-collapse: collapse;
      font-size: 0.68rem;
    }
    .pre-race-table col.col-gate { width: 2.6rem; }
    .pre-race-table col.col-name { width: 16%; min-width: 6rem; }
    .pre-race-table col.col-sex { width: 3.1rem; }
    .pre-race-table col.col-weight-ro { width: 3.1rem; }
    .pre-race-table col.col-jockey { width: 13%; min-width: 5.5rem; }
    .pre-race-table col.col-style { width: 4.85rem; }
    .pre-race-table col.col-num { width: 6.1rem; }
    .pre-race-gate-cell {
      text-align: center;
      vertical-align: middle;
    }
    .pre-race-gate-cell .entry-gate {
      margin: 0 auto;
      display: inline-block;
    }
    .pre-race-readonly {
      font-size: 0.66rem;
      color: #c7dbe8;
      font-variant-numeric: tabular-nums;
    }
    .pre-race-jockey-name {
      font-size: 0.66rem;
      color: #93c5fd;
      text-align: left;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 100%;
    }
    .pre-race-table th,
    .pre-race-table td {
      border-bottom: 1px solid #142538;
      padding: 6px 5px;
      text-align: center;
      vertical-align: middle;
      line-height: 1.35;
    }
    .pre-race-table thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #0f1e30;
      color: #7eb8d4;
      font-weight: 700;
      letter-spacing: 0.06em;
      font-size: 0.63rem;
      padding: 7px 5px;
    }
    .pre-race-table td.pre-race-num-cell {
      white-space: nowrap;
    }
    .pre-race-table td.pre-race-name {
      text-align: left;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #fff;
      font-weight: 700;
    }
    /* 脚質：出馬表と同じバッジ色（ラッパーに entry-style--* を付与） */
    .pre-race-style-wrap.entry-style-inline {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      max-width: 100%;
      vertical-align: middle;
      box-sizing: border-box;
    }
    .pre-race-style-wrap select.pre-race-select {
      appearance: none;
      -webkit-appearance: none;
      font-family: inherit;
      font-size: 0.62rem;
      font-weight: 700;
      line-height: 1.35;
      padding: 3px 6px;
      margin: 0;
      border: none;
      border-radius: 999px;
      background: transparent;
      color: inherit;
      cursor: pointer;
      max-width: 5.35rem;
      text-align: center;
    }
    .pre-race-style-wrap select.pre-race-select:focus {
      outline: 1px solid rgba(255, 255, 255, 0.45);
      outline-offset: 1px;
    }
    .pre-race-style-wrap select.pre-race-select option {
      font-weight: 700;
      background: #0f1e30;
      color: #e8eef5;
    }
    /* td は table-cell のまま。中身だけ flex にして列ズレを防ぐ */
    .pre-race-stepper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      width: 100%;
      box-sizing: border-box;
    }
    .pre-race-stepper button {
      flex: 0 0 auto;
      padding: 2px 6px;
      font-size: 0.64rem;
      min-width: 1.55rem;
      line-height: 1.25;
    }
    .pre-race-stepper .pre-race-val {
      display: inline-block;
      min-width: 2.6rem;
      font-variant-numeric: tabular-nums;
      color: #e7f3fb;
    }
    #btn-pre-race-confirm {
      padding: 6px 14px;
      font-size: 0.78rem;
      font-family: inherit;
      letter-spacing: 0;
      cursor: pointer;
      background: #1e3a52;
      border: 1px solid #445566;
      color: #e7f3fb;
      width: 9.4rem;
      border-radius: 0;
      transition: none;
    }
    #btn-pre-race-confirm:hover {
      background: #1e3a52;
      color: #e7f3fb;
      filter: brightness(1.08);
    }
    #btn-pre-race-confirm:active {
      background: #1e3a52;
      color: #e7f3fb;
    }

    /* ===== レースサマリー画面（全画面オーバーレイ） ===== */
    #race-summary-screen {
      position: fixed;
      inset: 0;
      z-index: 280;
      background: #0d1b2a;
      display: flex;
      flex-direction: column;
      padding: 14px 18px 16px;
      gap: 10px;
      min-height: 0;
      height: 100dvh;
      max-height: 100dvh;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
      overflow: hidden;
      align-items: center;
    }
    #race-summary-screen[hidden] {
      display: none !important;
    }

    .summary-header {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: min(100%, 1320px);
    }
    .summary-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px 16px;
      width: 100%;
      margin-bottom: 2px;
    }
    .summary-title-block {
      text-align: center;
    }
    .summary-header-row {
      display: contents;
    }
    .summary-header-row #btn-back-to-simulator {
      justify-self: auto;
      padding: 6px 14px;
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      background: #1e3a52;
      border: 1px solid #445566;
      color: #e7f3fb;
      width: 9.4rem;
      border-radius: 0;
    }
    .summary-header-row #btn-open-stats-summary {
      justify-self: auto;
      padding: 6px 14px;
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      background: #1e3a52;
      border: 1px solid #445566;
      color: #e7f3fb;
      cursor: pointer;
      font-family: inherit;
      width: 9.4rem;
      border-radius: 0;
    }
    #summary-race-info {
      font-size: 0.84rem;
      color: #8cb8d1;
      background: #06111e;
      border: 1px solid #1e3a5f;
      border-radius: 8px;
      padding: 9px 14px;
      letter-spacing: 0.02em;
      line-height: 1.45;
      width: min(100%, 1040px);
      margin: 0 auto;
      text-align: center;
    }
    #summary-race-info b { color: #e7f3fb; font-weight: bold; }

    .summary-body {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(340px, 500px) minmax(460px, 806px);
      gap: 14px;
      align-items: stretch;
      width: min(100%, 1320px);
      justify-content: center;
    }

    .summary-board,
    .summary-events {
      background: #06111e;
      border: 1px solid #1e3a5f;
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .summary-board .section-title,
    .summary-events .section-title {
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      color: #7eb8d4;
      margin-bottom: 10px;
    }

    #summary-placings {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding-right: 4px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .summary-placing-entry {
      display: grid;
      grid-template-columns: 3.2em 2.4em minmax(0, 1fr) minmax(9.6em, auto);
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 6px;
      background: #0a1828;
      border: 1px solid #15324d;
      font-variant-numeric: tabular-nums;
      color: #eef4ff;
    }
    .summary-placing-entry.is-top1 { border-color: #fde047; box-shadow: 0 0 14px rgba(253, 224, 71, 0.18); }
    .summary-placing-entry.is-top2 { border-color: #cfd8dc; }
    .summary-placing-entry.is-top3 { border-color: #d6a373; }
    .summary-placing-entry.is-top1 .summary-placing-rank,
    .summary-placing-entry.is-top1 .summary-placing-name {
      color: #fde047;
      text-shadow: 0 0 8px rgba(253, 224, 71, 0.4);
    }
    .summary-placing-entry.is-top2 .summary-placing-rank,
    .summary-placing-entry.is-top2 .summary-placing-name {
      color: #e2e8f0;
    }
    .summary-placing-entry.is-top3 .summary-placing-rank,
    .summary-placing-entry.is-top3 .summary-placing-name {
      color: #f8b88b;
    }
    .summary-placing-rank {
      font-size: 1.0rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-align: right;
    }
    .summary-placing-badge {
      display: inline-block;
      width: 2.2em;
      padding: 2px 0;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.30);
      text-align: center;
      font-size: 0.85em;
      font-weight: 700;
      line-height: 1.3;
      font-variant-numeric: tabular-nums;
    }
    .summary-placing-name {
      font-size: 0.92rem;
      font-weight: 700;
      color: #ffffff;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .summary-placing-meta {
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.55em;
      white-space: nowrap;
      min-width: 0;
    }
    .summary-placing-sex-age {
      font-size: 0.7rem;
      color: #c8d4e0;
      letter-spacing: 0.03em;
      font-weight: 700;
    }
    .summary-placing-sex-age.is-male {
      color: #93c5fd;
      text-shadow: 0 0 5px rgba(147, 197, 253, 0.28);
    }
    .summary-placing-sex-age.is-female {
      color: #f9a8d4;
      text-shadow: 0 0 5px rgba(249, 168, 212, 0.28);
    }
    .summary-placing-jockey {
      font-size: 0.7rem;
      color: #93c5fd;
      letter-spacing: 0.02em;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #summary-horse-events {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding-right: 4px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .summary-horse-block {
      background: #0a1828;
      border: 1px solid #15324d;
      border-radius: 8px;
      padding: 8px 10px 10px;
    }
    .summary-horse-block.is-top1 { border-color: rgba(253, 224, 71, 0.55); }
    .summary-horse-block.is-top3 { border-color: rgba(214, 163, 115, 0.5); }
    .summary-horse-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid #15324d;
      margin-bottom: 6px;
      font-size: 0.78rem;
      color: #eef4ff;
      flex-wrap: wrap;
    }
    .summary-horse-head .summary-horse-rank {
      font-weight: 800;
      color: #fde047;
      letter-spacing: 0.04em;
      min-width: 2.6em;
    }
    .summary-horse-head .summary-horse-name {
      font-weight: 700;
      color: #ffffff;
    }
    .summary-horse-events {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .summary-horse-event {
      font-size: 0.7rem;
      line-height: 1.5;
      color: #c8d4df;
      padding: 2px 0;
      border-bottom: 1px dashed rgba(30, 58, 95, 0.5);
    }
    .summary-horse-event:last-child {
      border-bottom: none;
    }
    .summary-horse-event .summary-event-phase {
      display: inline-block;
      min-width: 7.5em;
      padding: 1px 6px;
      margin-right: 6px;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: #7dd3fc;
      background: rgba(14, 165, 233, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 999px;
      text-align: center;
      vertical-align: 1px;
    }
    .summary-horse-event-empty {
      font-size: 0.7rem;
      color: #6c8aa4;
      font-style: italic;
      padding: 2px 0;
    }

    @media (max-width: 880px) {
      .summary-body {
        grid-template-columns: 1fr;
      }
      .summary-board,
      .summary-events {
        max-height: 50vh;
      }
    }

  </style>
</head>
<body>
  <!-- プレレース：出走パラメータ調整（初期表示） -->
  <div id="pre-race-editor" hidden aria-label="出走パラメータ編集">
    <div class="pre-race-header">
      <div class="pre-race-toolbar">
        <button type="button" id="btn-pre-race-confirm">シミュレーター画面</button>
      </div>
      <h1 class="app-main-title">
        <span class="title-brand-icon" aria-hidden="true">🏇</span>
        <span class="title-text">JRA RACE SIMULATOR</span>
      </h1>
      <p class="app-subtitle app-subtitle--pre-race">パラメーター調整</p>
      <div id="pre-race-race-info"></div>
    </div>
    <div class="pre-race-table-wrap">
      <div class="pre-race-table-inner">
      <table class="pre-race-table" id="pre-race-entry-table">
        <colgroup>
          <col class="col-gate">
          <col class="col-name">
          <col class="col-sex">
          <col class="col-weight-ro">
          <col class="col-jockey">
          <col class="col-style">
          <col class="col-num">
          <col class="col-num">
          <col class="col-num">
          <col class="col-num">
        </colgroup>
        <thead>
          <tr>
            <th>馬番</th>
            <th>馬名</th>
            <th>性齢</th>
            <th>斤量</th>
            <th>騎手</th>
            <th>脚質</th>
            <th>Ave-3F</th>
            <th>上り3F</th>
            <th>騎手勝率</th>
            <th>騎手3着内率</th>
          </tr>
        </thead>
        <tbody id="pre-race-tbody"></tbody>
      </table>
      </div>
    </div>
  </div>

  <button type="button" id="btn-back-to-pre-race" aria-label="パラメーター調整">パラメーター調整</button>

  <!-- レースサマリー画面（全画面オーバーレイ） -->
  <div id="race-summary-screen" hidden aria-label="レースサマリー">
    <div class="summary-header">
      <div class="summary-toolbar">
        <div class="summary-header-row">
          <button type="button" id="btn-back-to-simulator">シミュレーター画面</button>
          <button type="button" id="btn-open-stats-summary">集計画面</button>
        </div>
      </div>
      <div class="summary-title-block">
        <h1 class="app-main-title">
          <span class="title-brand-icon" aria-hidden="true">🏇</span>
          <span class="title-text">JRA RACE SIMULATOR</span>
        </h1>
        <p class="app-subtitle app-subtitle--summary">レースサマリー</p>
      </div>
      <div id="summary-race-info"></div>
    </div>
    <div class="summary-body">
      <section class="summary-board">
        <p class="section-title">🏁 着順掲示板</p>
        <div id="summary-placings"></div>
      </section>
      <section class="summary-events">
        <p class="section-title">📝 各馬のイベント</p>
        <div id="summary-horse-events"></div>
      </section>
    </div>
  </div>

  <h1>
    <span class="title-brand-icon" aria-hidden="true">🏇</span>
    <span class="title-text">JRA RACE SIMULATOR</span>
  </h1>

  <!-- コントロール -->
  <div id="controls">
    <button id="btn-run">▶ レース開始</button>
    <button id="btn-reset" disabled>↺ リセット</button>
    <button id="btn-show-summary" type="button" disabled>📊 レースサマリー</button>
    <button id="btn-open-stats" type="button">📈 集計画面</button>
    <div id="sim-options" role="group" aria-label="シミュレーションオプション">
      <label>
        <input id="toggle-reproducible" type="checkbox">
        再現性モード
      </label>
      <label>
        <input id="toggle-auto-advance" type="checkbox">
        自動モード
      </label>
    </div>
  </div>

  <!-- 3カラムレイアウト -->
  <div id="main-layout">
    <div id="race-info"></div>

    <!-- 左：出馬表 -->
    <div id="entry-panel">
      <p class="section-title">📋 出馬表</p>
      <div id="entry-list"></div>
    </div>

    <!-- 中央：盤面 -->
    <div id="field-wrap">
      <div id="field-viewport">
        <canvas id="field-canvas"></canvas>
      </div>
      <div id="phase-indicator">スタート</div>
    </div>

    <!-- 右：レースログ -->
    <div id="right-panel">
      <div class="right-block" id="race-log-block">
        <p class="section-title">📝 レースログ</p>
        <div id="log-panel">
          <div class="log-entry" style="color:#334;">待機中...</div>
        </div>
      </div>
      <div class="right-block" id="placing-log-block">
        <p class="section-title">🏁 着順掲示板</p>
        <div id="placing-panel"></div>
      </div>
    </div>

  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
